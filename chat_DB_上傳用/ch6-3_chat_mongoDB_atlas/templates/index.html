<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>即時聊天室</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-container">
    <!-- 標題列：線上人數、改名、清空 -->
    <div class="chat-header">
      <div>
        <h5 class="mb-0"><i class="bi bi-chat-dots"></i> 即時聊天室</h5>
        <small>線上人數：<span id="online-count">0</span></small>
      </div>
      <div>
        <button id="change-name-btn" class="btn btn-sm btn-light" title="更改暱稱"><i class="bi bi-person-gear"></i></button>
        <button id="clear-btn" class="btn btn-sm btn-light" title="清空聊天"><i class="bi bi-trash"></i></button>
      </div>
    </div>

    <!-- 連線狀態條 -->
    <div id="connection-status" class="connection-status">連線中…</div>

    <!-- 訊息區 -->
    <div id="chat-messages" class="chat-messages"></div>

    <!-- 輸入區 -->
    <div class="chat-input">
      <div class="position-relative">
        <button class="btn btn-light emoji-btn" type="button">😊</button>
      </div>
      <textarea id="message-input" class="form-control" rows="1" placeholder="輸入訊息（支援 Markdown），Enter 送出、Shift+Enter 換行"></textarea>
      <button id="send-button" class="btn btn-primary"><i class="bi bi-send"></i></button>
    </div>
  </div>

  <!-- 套件：jQuery、Socket.IO、Markdown、XSS 清理、語法高亮、Mermaid -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
